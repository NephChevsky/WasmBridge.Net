name: Publish wasmbridge-net to npm

on:
  workflow_dispatch:

jobs:
  publish:
    runs-on: ubuntu-latest
    environment: production
    permissions:
      id-token: write  # enable OIDC trusted publishing (no NPM_TOKEN secret needed)
      contents: read
    defaults:
      run:
        working-directory: wasmbridge-net
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: '22'
          registry-url: 'https://registry.npmjs.org'

      # Trusted publishing (OIDC) requires npm >= 11.5.1; setup-node's bundled npm may lag behind.
      - name: Update npm
        run: npm install -g npm@latest

      - name: Install
        run: npm ci

      - name: Test
        run: npm test

      - name: Publish
        run: npm publish --provenance --access public
